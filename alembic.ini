[alembic]
script_location = migraciones
prepend_sys_path = .
# La URL sale de config.env, no de aquí: este archivo se versiona y la contraseña no.
sqlalchemy.url =

file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = consola

[formatters]
keys = generico

[logger_root]
level = WARNING
handlers = consola
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_consola]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generico

[formatter_generico]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
