<!doctype html>
<html lang="es-MX" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)" />
    <title>MyProgressPlan</title>

    <!-- Instalable en la pantalla de inicio. En iPhone no es adorno: Safari solo permite
         notificaciones push si la app está instalada. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icono-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MyProgress" />
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <!-- Antes de pintar: si no, quien eligió oscuro ve un destello blanco al abrir. -->
    <script>
      (function () {
        var t = localStorage.getItem("mpp:tema");
        if (t === "claro") document.documentElement.classList.add("claro");
        if (t === "oscuro") document.documentElement.classList.add("dark");
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
