# nginx para MyFittPlan.
#
# Tres trabajos: servir el frontend estático, pasar /api a uvicorn y entregar las fotos con
# `X-Accel-Redirect`.
#
# **La location de los archivos es `internal`**: nadie puede pedir una foto por su ruta. Solo
# la sirve nginx cuando la aplicación ya comprobó la sesión, el inquilino y el permiso, y
# anotó el acceso en la bitácora. Sin `internal`, adivinar una ruta bastaría para leer el
# expediente de otra persona.
#
# Instalación:
#   sudo cp despliegue/nginx-myfittplan.conf /etc/nginx/sites-available/myfittplan
#   sudo ln -s /etc/nginx/sites-available/myfittplan /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d myfittplan.com -d www.myfittplan.com

# ---- Límites de petición ----
#
# Es la única capa que puede frenar una avalancha: cuando la petición llega a Python ya
# costó un proceso, y una que ni se acepta no cuesta nada.
#
# `$binary_remote_addr` en vez de `$remote_addr` porque ocupa 4 bytes en lugar de 15: en
# 10 MB caben unas 160 000 direcciones distintas.
#
# Nada de esto para un ataque distribuido de verdad. Para eso hace falta algo delante del
# servidor —Cloudflare o el filtro del proveedor—; lo que hay aquí frena a un solo origen,
# que es de lo que se trata en la práctica.
limit_req_zone  $binary_remote_addr zone=api:10m      rate=10r/s;
limit_req_zone  $binary_remote_addr zone=acceso:10m   rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conexiones:10m;

# 429 y no 503: es un límite, no una caída, y el cliente puede reintentar.
limit_req_status  429;
limit_conn_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name myfittplan.com www.myfittplan.com;

    # Certbot escribe aquí su desafío; todo lo demás sube a HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name myfittplan.com www.myfittplan.com;

    ssl_certificate     /etc/letsencrypt/live/myfittplan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myfittplan.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Una foto de chequeo pesa unos 300 KB ya recortada, pero el original que sube el teléfono
    # llega en varios megas. El tope real lo vuelve a comprobar la aplicación: nginx puede
    # estar mal configurado y el servidor no debe confiar en él.
    #
    # Debe estar al menos a la altura de `cuerpo_maximo_bytes` (28 MB): el cuerpo multipart
    # es mayor que el archivo que transporta, y si nginx cortara antes rechazaría con 413
    # subidas que la aplicación aceptaría.
    client_max_body_size 28m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Frontend estático ----
    root /var/www/myfittplan;
    index index.html;

    location / {
        # SPA: cualquier ruta desconocida la resuelve el enrutador del navegador.
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        # Los nombres llevan hash de contenido: se pueden cachear para siempre.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /sw.js {
        # El service worker **nunca** se cachea: una versión vieja seguiría gobernando las
        # notificaciones después de actualizar la aplicación.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Más de veinte conexiones simultáneas desde una sola IP no es una persona usando la
    # aplicación.
    limit_conn conexiones 20;

    # ---- Acceso ----
    #
    # Aparte del resto y mucho más apretado: diez por minuto sobra para alguien que escribe
    # mal su contraseña, y deja sin sentido probar contraseñas desde fuera. El servidor
    # además cuenta los fallos por correo y por IP (`app/servicios/limites.py`): nginx puede
    # estar mal configurado y la aplicación no debe confiar en él.
    location = /api/auth/login {
        limit_req zone=acceso burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- API ----
    location /api/ {
        # `burst` con `nodelay` deja pasar un pico corto —abrir el panel dispara varias
        # peticiones a la vez— y corta el goteo sostenido.
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- Archivos protegidos ----
    #
    # `internal` es lo que hace segura esta location: solo se llega por el X-Accel-Redirect
    # que devuelve la aplicación. Una petición directa a /protegido/... responde 404.
    location /protegido/ {
        internal;
        alias /var/lib/myfittplan/datos/;

        # Dato sensible: no debe quedarse en cachés intermedias ni en proxies del operador.
        add_header Cache-Control "private, max-age=300" always;
    }
}
