# nginx para MyProgressPlan.
#
# Tres trabajos: servir el frontend estático, pasar /api a uvicorn y entregar las fotos con
# `X-Accel-Redirect`.
#
# **La location de los archivos es `internal`**: nadie puede pedir una foto por su ruta. Solo
# la sirve nginx cuando la aplicación ya comprobó la sesión, el inquilino y el permiso, y
# anotó el acceso en la bitácora. Sin `internal`, adivinar una ruta bastaría para leer el
# expediente de otra persona.
#
# Instalación:
#   sudo cp despliegue/nginx-myprogressplan.conf /etc/nginx/sites-available/myprogressplan
#   sudo ln -s /etc/nginx/sites-available/myprogressplan /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d myprogressplan.com -d www.myprogressplan.com

server {
    listen 80;
    listen [::]:80;
    server_name myprogressplan.com www.myprogressplan.com;

    # Certbot escribe aquí su desafío; todo lo demás sube a HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name myprogressplan.com www.myprogressplan.com;

    ssl_certificate     /etc/letsencrypt/live/myprogressplan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myprogressplan.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Una foto de chequeo pesa unos 300 KB ya recortada, pero el original que sube el teléfono
    # llega en varios megas. El tope real lo vuelve a comprobar la aplicación: nginx puede
    # estar mal configurado y el servidor no debe confiar en él.
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Frontend estático ----
    root /var/www/myprogressplan;
    index index.html;

    location / {
        # SPA: cualquier ruta desconocida la resuelve el enrutador del navegador.
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        # Los nombres llevan hash de contenido: se pueden cachear para siempre.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /sw.js {
        # El service worker **nunca** se cachea: una versión vieja seguiría gobernando las
        # notificaciones después de actualizar la aplicación.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # ---- API ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- Archivos protegidos ----
    #
    # `internal` es lo que hace segura esta location: solo se llega por el X-Accel-Redirect
    # que devuelve la aplicación. Una petición directa a /protegido/... responde 404.
    location /protegido/ {
        internal;
        alias /var/lib/myprogressplan/datos/;

        # Dato sensible: no debe quedarse en cachés intermedias ni en proxies del operador.
        add_header Cache-Control "private, max-age=300" always;
    }
}
